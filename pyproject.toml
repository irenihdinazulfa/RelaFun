# Dipakai Vercel untuk memasang server ringan Asisten publik (server.py).
# Aplikasi lengkap (start.bat) memakai apps/api/requirements.txt.
[project]
name = "relafun-asisten-publik"
version = "3.4.0"
description = "Asisten Belajar RelaFun (AI Gemini) untuk versi GitHub Pages"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sympy>=1.13",
]

[tool.vercel]
entrypoint = "server:app"
