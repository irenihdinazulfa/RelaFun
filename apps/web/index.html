<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RelaFun — Relasi dan Fungsi</title>
  <meta name="description" content="Belajar Relasi dan Fungsi kelas 8 SMP langkah demi langkah.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RelaFun">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Terapkan tema & ukuran teks sebelum halaman tampil (mencegah kedip).
    try {
      var s = JSON.parse(localStorage.getItem("lk_settings") || "{}");
      if (s.theme === "dark" || s.theme === "light") document.documentElement.dataset.theme = s.theme;
      if (s.bigText) document.documentElement.classList.add("big-text");
      if (s.reduceMotion) document.documentElement.classList.add("reduce-motion");
    } catch (e) {}
    // Simpan tawaran instal Chrome agar bisa ditampilkan sebagai tombol "Pasang sekarang".
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__installPrompt = e;
      document.dispatchEvent(new CustomEvent("installable"));
    });
  </script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot">
      <img src="icons/icon.svg" alt="" width="72" height="72">
      <p>Memuat RelaFun…</p>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>RelaFun membutuhkan JavaScript. Aktifkan JavaScript di peramban Anda.</noscript>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
