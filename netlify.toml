# Netlify: frontend RelaFun (PWA statis). Backend & database tetap di Supabase.
# Build memakai scripts/build_static.py (hanya pustaka standar Python). Karena scripts/supabase_url.txt
# berisi alamat Supabase, hasil build memakai backend Supabase (window.RELAFUN_API_URL).
# Tidak ada kunci API di sini; kunci hanya di Secrets Supabase. Lihat docs/20-SUPABASE.md bagian Netlify.

[build]
  command = "python3 scripts/build_static.py dist"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# Service worker & config harus selalu yang terbaru agar pembaruan aplikasi cepat sampai ke siswa.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
