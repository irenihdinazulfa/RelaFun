# Konfigurasi deploy ke Render (https://render.com) — agar RelaFun punya link HTTPS publik.
# Langkah: Render → New → Blueprint → pilih repo RelaFun → Apply.
services:
  - type: web
    name: relafun
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
# Fitur AI (opsional, berbayar): tambahkan ANTHROPIC_API_KEY di menu Environment setelah deploy.
